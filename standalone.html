<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Card</title><!-- styles -->
    <style>
        .showcase {
            z-index: 99;
            max-width: min(330px, 80vw);
            margin: auto;
        }
    </style>
    <link rel="stylesheet" href="css/cards/base.css" />
    <link rel="stylesheet" href="css/cards.css" />
    <link rel="stylesheet" href="css/cards/basic.css" />
    <link rel="stylesheet" href="css/cards/reverse-holo.css" />
    <link rel="stylesheet" href="css/cards/regular-holo.css" />
    <link rel="stylesheet" href="css/cards/cosmos-holo.css" />
    <link rel="stylesheet" href="css/cards/amazing-rare.css" />
    <link rel="stylesheet" href="css/cards/radiant-holo.css" />
    <link rel="stylesheet" href="css/cards/v-regular.css" />
    <link rel="stylesheet" href="css/cards/v-full-art.css" />
    <link rel="stylesheet" href="css/cards/v-max.css" />
    <link rel="stylesheet" href="css/cards/v-star.css" />
    <link rel="stylesheet" href="css/cards/trainer-full-art.css" />
    <link rel="stylesheet" href="css/cards/rainbow-holo.css" />
    <link rel="stylesheet" href="css/cards/rainbow-alt.css" />
    <link rel="stylesheet" href="css/cards/secret-rare.css" />
    <link rel="stylesheet" href="css/cards/trainer-gallery-holo.css" />
    <link rel="stylesheet" href="css/cards/trainer-gallery-v-regular.css" />
    <link rel="stylesheet" href="css/cards/trainer-gallery-v-max.css" />
    <link rel="stylesheet" href="css/cards/trainer-gallery-secret-rare.css" />
    <link rel="stylesheet" href="css/cards/shiny-rare.css" />
    <link rel="stylesheet" href="css/cards/shiny-v.css" />
    <link rel="stylesheet" href="css/cards/shiny-vmax.css" />
    <link rel="stylesheet" href="css/cards/swsh-pikachu.css" />
    <style>
        :root {
            --pointer-x: 50%;
            --pointer-y: 50%;
            --card-scale: 1;
            --card-opacity: 0;
            --translate-x: 0px;
            --translate-y: 0px;
            --rotate-x: 0deg;
            --rotate-y: 0deg;
            --background-x: var(--pointer-x);
            --background-y: var(--pointer-y);
            --pointer-from-center: 0;
            --pointer-from-top: var(--pointer-from-center);
            --pointer-from-left: var(--pointer-from-center);
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="showcase"></div>
    <script>
        // 卡片数据
        const cardData = {
            "img": "https://images.pokemontcg.io/swsh12pt5/160_hires.png",
            "foil": "https://poke-holo.b-cdn.net/foils/swsh12pt5/foils/upscaled/160_foil_etched_swsecret_2x.webp",
            "mask": "https://poke-holo.b-cdn.net/foils/swsh12pt5/masks/upscaled/160_foil_etched_swsecret_2x.webp",
            "id": "swsh12pt5-160",
            "name": "Pikachu",
            "number": "160",
            "set": "swsh12pt5",
            "types": [
                "Lightning"
            ],
            "subtypes": [
                "Basic"
            ],
            "supertype": "Pokémon",
            "rarity": "Rare Secret",
            "showcase": true
        };

        // 工具函数
        const round = (value, precision = 3) => parseFloat(value.toFixed(precision));

        const clamp = (value, min = 0, max = 100) => {
            return Math.min(Math.max(value, min), max);
        };

        const adjust = (value, fromMin, fromMax, toMin, toMax) => {
            return round(toMin + (toMax - toMin) * (value - fromMin) / (fromMax - fromMin));
        };

        // 从cardData中提取数据
        let id = cardData.id || "";
        let name = cardData.name || "";
        let number = cardData.number || "";
        let set = cardData.set || "";
        let types = cardData.types || "";
        let subtypes = cardData.subtypes || "basic";
        let supertype = cardData.supertype || "pokémon";
        let rarity = cardData.rarity || "common";
        let img = cardData.img || "";
        let back = "https://tcg.pokemon.com/assets/img/global/tcg-card-back-2x.jpg";
        let foil = cardData.foil || "";
        let mask = cardData.mask || "";
        let showcase = cardData.showcase || false;

        const randomSeed = {
            x: Math.random(),
            y: Math.random()
        };

        const cosmosPosition = {
            x: Math.floor(randomSeed.x * 734),
            y: Math.floor(randomSeed.y * 1280)
        };

        let isTrainerGallery = false;
        let back_img = back;
        let img_base = img.startsWith("http") ? "" : "https://images.pokemontcg.io/";

        let thisCard;
        let active = false;
        let interacting = false;
        let loading = false;
        let isVisible = document.visibilityState === "visible";

        // 基本数据
        let degrees = { x: 0, y: 0 };
        let opacity = 0;
        let rotateDelta = { x: 0, y: 0 };
        let translateValues = { x: 0, y: 0 };
        let scaleValue = 1;

        // 事件处理函数
        const interact = (e) => {
            if (!isVisible) {
                interacting = false;
                return;
            }

            interacting = true;

            if (e.type === "touchmove") {
                e.clientX = e.touches[0].clientX;
                e.clientY = e.touches[0].clientY;
            }

            const $el = e.target;
            const rect = $el.getBoundingClientRect();
            const absolute = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
            };
            const percent = {
                x: clamp(round((100 / rect.width) * absolute.x)),
                y: clamp(round((100 / rect.height) * absolute.y)),
            };
            const center = {
                x: percent.x - 50,
                y: percent.y - 50,
            };

            // 更新基本值
            degrees = {
                x: round(-(center.x / 3.5)),
                y: round(center.y / 2)
            };
            opacity = 1;

            updateCardStyles();
        };

        const interactEnd = (e, delay = 500) => {
            interacting = false;
            setTimeout(function () {
                if (!interacting) {
                    degrees = { x: 0, y: 0 };
                    opacity = 0;
                    updateCardStyles();
                }
            }, delay);
        };

        // 处理数据转换
        const processCardData = () => {
            rarity = typeof rarity === 'string' ? rarity.toLowerCase() : '';
            supertype = typeof supertype === 'string' ? supertype.toLowerCase() : '';
            number = typeof number === 'string' ? number.toLowerCase() : '';

            isTrainerGallery = !!number.match(/^[tg]g/i) || !!(id === "swshp-SWSH076" || id === "swshp-SWSH077");

            if (Array.isArray(types)) {
                types = types.join(" ").toLowerCase();
            }

            if (Array.isArray(subtypes)) {
                subtypes = subtypes.join(" ").toLowerCase();
            }
        };

        // 更新卡片样式
        const updateCardStyles = () => {
            if (!thisCard) return;

            const dynamicStyles = `
                --pointer-x: ${50 - degrees.x * 1.5}%;
                --pointer-y: ${50 + degrees.y * 1.5}%;
                --pointer-from-center: ${clamp(Math.sqrt(
                degrees.y * degrees.y +
                degrees.x * degrees.x
            ) / 10, 0, 1)};
                --pointer-from-top: ${(50 + degrees.y * 1.5) / 100};
                --pointer-from-left: ${(50 - degrees.x * 1.5) / 100};
                --card-opacity: ${opacity};
                --rotate-x: ${degrees.x + rotateDelta.x}deg;
                --rotate-y: ${degrees.y + rotateDelta.y}deg;
                --background-x: ${adjust(-degrees.x, -30, 30, 37, 63)}%;
                --background-y: ${adjust(degrees.y, -30, 30, 33, 67)}%;
                --card-scale: ${scaleValue};
                --translate-x: ${translateValues.x}px;
                --translate-y: ${translateValues.y}px;
            `;

            thisCard.style.cssText = dynamicStyles;
        };

        // 初始化并渲染卡片
        const renderCard = () => {
            processCardData();

            const cardElement = document.createElement('div');
            cardElement.className = `card ${types} / interactive / `;
            if (active) cardElement.classList.add('active');
            if (interacting) cardElement.classList.add('interacting');
            if (loading) cardElement.classList.add('loading');
            if (mask) cardElement.classList.add('masked');

            cardElement.dataset.number = number;
            cardElement.dataset.set = set;
            cardElement.dataset.subtypes = subtypes;
            cardElement.dataset.supertype = supertype;
            cardElement.dataset.rarity = rarity;
            cardElement.dataset.trainerGallery = isTrainerGallery;

            thisCard = cardElement;

            const staticStyles = `
                --seedx: ${randomSeed.x};
                --seedy: ${randomSeed.y};
                --cosmosbg: ${cosmosPosition.x}px ${cosmosPosition.y}px;
            `;

            const foilStyles = `
                --mask: url(${mask});
                --foil: url(${foil});
            `;

            cardElement.innerHTML = `
                <div class="card__translater">
                    <button
                        class="card__rotator"
                        aria-label="Expand the Pokemon Card; ${name}."
                        tabindex="0">
                        <img
                            class="card__back"
                            src="${back_img}"
                            alt="The back of a Pokemon Card, a Pokeball in the center with Pokemon logo above and below"
                            loading="lazy"
                            width="660"
                            height="921"
                        />
                        <div class="card__front" style="${staticStyles} ${foilStyles}">
                            <img
                                src="${img_base}${img}"
                                alt="Front design of the ${name} Pokemon Card, with the stats and info around the edge"
                                loading="lazy"
                                width="660"
                                height="921"
                            />
                            <div class="card__shine"></div>
                            <div class="card__glare"></div>
                        </div>
                    </button>
                </div>
            `;

            document.querySelector('.showcase').appendChild(cardElement);

            // 添加事件监听
            const rotator = cardElement.querySelector('.card__rotator');
            rotator.addEventListener('pointermove', interact);
            rotator.addEventListener('touchmove', interact);
            rotator.addEventListener('touchstart', interact);
            rotator.addEventListener('mouseout', interactEnd);
            rotator.addEventListener('touchend', interactEnd);
            rotator.addEventListener('blur', interactEnd);

            // 更新初始样式
            updateCardStyles();
        };

        // 文档加载完成后渲染卡片
        renderCard();

    </script>
</body>

</html>
